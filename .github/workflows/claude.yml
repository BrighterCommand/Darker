name: Claude Code

# Opt-in only: a maintainer comments `@claude` (for example `@claude review this PR`)
# on a pull request. Nothing runs automatically on open or on push - reviews cost
# real money, so they are requested rather than assumed. The action itself refuses
# commenters without write access to the repository.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # --model is pinned deliberately: left unset, the action follows the
          # Claude Code default, which drifts to newer, more expensive models.
          # --max-turns is a runaway guard. A review reads the diff, the files
          # around it, CLAUDE.md and the .agent_instructions/* pages it points
          # to before it writes anything, so it needs room.
          # --allowed-tools accumulates with the list tag mode sets for itself.
          # --disallowed-tools claws back the write access tag mode grants by
          # default: a comment asking for a review is not a licence to commit.
          # The checkout is shallow, so the diff comes from `gh pr diff`, not git.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 40
            --allowed-tools "Task,mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
            --disallowed-tools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*)"
